name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Capri and the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Roslyn compiler that ships with Visual Studio on the runner (the code needs C# 6 or newer)
          $vs  = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $csc = Join-Path $vs "MSBuild\Current\Bin\Roslyn\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }

          $ra      = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8"
          $facades = Join-Path $ra "Facades"
          $winmd   = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\UnionMetadata" -Recurse -Filter Windows.winmd | Sort-Object FullName | Select-Object -Last 1).FullName
          Write-Host "csc: $csc"
          Write-Host "winmd: $winmd"

          $names = @("System","System.Core","System.Drawing","System.Windows.Forms","System.Runtime.Serialization","System.Speech",
                     "UIAutomationClient","UIAutomationTypes","WindowsBase","System.IO.Compression","System.IO.Compression.FileSystem",
                     "System.Security","System.Xml","System.Net.Http","Microsoft.CSharp","System.Runtime.WindowsRuntime")
          $refs = @()
          foreach ($n in $names) { $refs += "/r:$ra\$n.dll" }
          foreach ($f in @("System.Runtime","System.Threading.Tasks","System.IO","System.Runtime.InteropServices.WindowsRuntime")) {
            if (Test-Path "$facades\$f.dll") { $refs += "/r:$facades\$f.dll" }
          }
          $refs += "/r:$winmd"

          New-Item -ItemType Directory -Force build | Out-Null

          # Pictures and font get embedded under the names the code looks for
          $res = @()
          foreach ($png in Get-ChildItem assets\sprites\*.png) { $res += "/resource:$($png.FullName),Capri.Sprite.$($png.Name)" }
          $res += "/resource:assets\chip.ico,Capri.Chip.ico"
          $res += "/resource:assets\chip.png,Capri.Chip.png"
          $res += "/resource:assets\fonts\ShareTechMono-Regular.ttf,Capri.Font.Mono.ttf"

          # 1. The app itself
          $src = Get-ChildItem app\*.cs | Where-Object { $_.Name -ne "Setup.cs" } | ForEach-Object { $_.FullName }
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /langversion:latest `
                 /win32manifest:app\app.manifest /win32icon:assets\chip.ico /out:build\Capri.exe `
                 @refs @res @src
          if ($LASTEXITCODE -ne 0) { throw "Capri.exe failed to build" }

          # 2. The installer, which carries Capri.exe inside it
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /langversion:latest `
                 /win32manifest:app\app.manifest /win32icon:assets\chip.ico /out:build\Capri-Setup.exe `
                 @refs "/resource:build\Capri.exe,Capri.App.exe" "/resource:assets\chip.ico,Capri.Chip.ico" "/resource:assets\chip.png,Capri.Chip.png" `
                 app\Setup.cs app\AssemblyInfo.cs
          if ($LASTEXITCODE -ne 0) { throw "Capri-Setup.exe failed to build" }

      - uses: actions/upload-artifact@v4
        with:
          name: capri-windows
          path: build/*.exe
